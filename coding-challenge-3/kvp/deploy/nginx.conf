# API gateway.
#   :8080  REST (API v1): routes by path to the owning service.
#          /docs → Swagger UI, /openapi.yaml → the REST contract.
#   :9090  gRPC (API v2): routes by gRPC service name (HTTP/2, plaintext).
# /internal/* is deliberately not routed (service-to-service only).
#
# Upstreams are variables + Docker's DNS resolver, so nginx re-resolves
# service names and keeps working when a service container is recreated.
resolver 127.0.0.11 valid=5s ipv6=off;

log_format json escape=json '{"time":"$time_iso8601","service":"gateway","method":"$request_method",'
  '"path":"$uri","status":$status,"duration_ms":$request_time,"upstream":"$upstream_addr",'
  '"traceparent":"$http_traceparent"}';

server {
  listen 8080;
  access_log /dev/stdout json;
  proxy_set_header Host $host;
  proxy_http_version 1.1;

  set $ride     http://ride-service:8080;
  set $driver   http://driver-service:8080;
  set $dispatch http://dispatch-service:8080;
  set $swagger  http://swagger-ui:8080;

  location /internal/                                    { return 404; }
  location ~ ^/rides/[^/]+/offers/[^/]+/(accept|reject)$ { proxy_pass $dispatch; }
  location ~ ^/rides/[^/]+/dispatch$                     { proxy_pass $dispatch; }
  location ~ ^/drivers/[^/]+/offer$                      { proxy_pass $dispatch; }
  location /rides                                        { proxy_pass $ride; }
  location /drivers                                      { proxy_pass $driver; }
  location = /healthz                                    { default_type application/json; return 200 '{"status":"ok"}'; }

  # API documentation: the OpenAPI contract and Swagger UI ("Try it out" calls this gateway).
  location = /openapi.yaml { root /usr/share/nginx/api; default_type application/yaml; add_header Cache-Control no-cache; }
  location = /docs         { return 301 /docs/; }
  location /docs/          { proxy_pass $swagger; }
}

# gRPC (API v2). Streams are long-lived, so read/send/body timeouts are raised.
server {
  listen 9090;
  http2 on;
  access_log /dev/stdout json;
  grpc_read_timeout   1h;
  grpc_send_timeout   1h;
  client_body_timeout 1h;
  grpc_set_header traceparent $http_traceparent;

  set $driver_grpc   grpc://driver-service:9090;
  set $dispatch_grpc grpc://dispatch-service:9090;

  location /ridehail.driver.v2.DriverLocationService/ { grpc_pass $driver_grpc; }
  location /ridehail.dispatch.v2.OfferService/        { grpc_pass $dispatch_grpc; }

  # Anything else: gRPC status 12 (UNIMPLEMENTED).
  location / {
    default_type application/grpc;
    add_header grpc-status 12 always;
    add_header grpc-message "unknown service" always;
    return 204;
  }
}
