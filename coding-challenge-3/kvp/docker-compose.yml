name: ridehail

x-service-env: &service-env
  KAFKA_BROKERS: redpanda:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  HTTP_ADDR: ":8080"
  GRPC_ADDR: ":9090" # used by driver-service and dispatch-service (API v2)
  TOPIC_PARTITIONS: "6"

x-service: &service
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "/app", "healthcheck"]
    interval: 3s
    timeout: 3s
    retries: 20
  depends_on:
    postgres: { condition: service_healthy }
    redpanda: { condition: service_healthy }
    lgtm: { condition: service_started }

services:
  # ---------- infrastructure ----------
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -lqt | grep -q dispatch_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v26.2.6
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports: ["19092:19092", "9644:9644"]
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 3s
      timeout: 5s
      retries: 40

  redpanda-console:
    image: redpandadata/console:v3.13.1
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8088:8080"]
    depends_on:
      redpanda: { condition: service_healthy }

  lgtm: # OTel Collector + Loki + Tempo + Prometheus + Grafana (dev only)
    image: grafana/otel-lgtm:0.39.0
    ports: ["3000:3000", "4317:4317", "4318:4318"]
    volumes:
      - ./deploy/grafana/dispatch-overview.json:/otel-lgtm/ridehail-dashboard.json:ro
      - ./deploy/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ridehail.yaml:ro

  # ---------- services ----------
  ride-service:
    <<: *service
    build: { context: ., args: { SERVICE: ride } }
    image: ridehail/ride-service:dev
    environment:
      <<: *service-env
      DATABASE_URL: postgres://ride_svc:ride_svc@postgres:5432/ride_db
    ports: ["8081:8080"]

  driver-service:
    <<: *service
    build: { context: ., args: { SERVICE: driver } }
    image: ridehail/driver-service:dev
    environment:
      <<: *service-env
      DATABASE_URL: postgres://driver_svc:driver_svc@postgres:5432/driver_db
    ports: ["8082:8080"]

  dispatch-service:
    <<: *service
    build: { context: ., args: { SERVICE: dispatch } }
    image: ridehail/dispatch-service:dev
    environment:
      <<: *service-env
      DATABASE_URL: postgres://dispatch_svc:dispatch_svc@postgres:5432/dispatch_db
      REDIS_ADDR: redis:6379
      DRIVER_SERVICE_URL: http://driver-service:8080
      MATCH_RADIUS_M: ${MATCH_RADIUS_M:-2000}
      OFFER_TIMEOUT: ${OFFER_TIMEOUT:-30s}
      DISPATCH_RETRY_INTERVAL: ${DISPATCH_RETRY_INTERVAL:-10s}
    ports: ["8083:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      redis: { condition: service_healthy }
      lgtm: { condition: service_started }

  swagger-ui: # REST API documentation, served by the gateway at http://localhost:8080/docs/
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      BASE_URL: /docs
      SWAGGER_JSON_URL: /openapi.yaml

  gateway:
    image: nginx:1.29-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/openapi.yaml:/usr/share/nginx/api/openapi.yaml:ro
    ports: ["8080:8080", "9090:9090"] # REST (v1), gRPC (v2)
    depends_on:
      ride-service: { condition: service_healthy }
      driver-service: { condition: service_healthy }
      dispatch-service: { condition: service_healthy }
      swagger-ui: { condition: service_started }

volumes:
  pgdata:
  redpanda:
