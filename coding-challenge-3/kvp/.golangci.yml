# Go lint rules: `make lint` locally, the `lint` job in CI.
# A small set that catches bugs; no style-only linters.
version: "2"

run:
  timeout: 5m
  build-tags: [integration, e2e]   # lint test files behind build tags too

linters:
  default: none
  enable:
    - errcheck      # ignored errors
    - govet         # suspicious constructs
    - staticcheck   # bugs, simplifications, deprecated APIs
    - ineffassign   # assignments that are never used
    - unused        # dead code
    - bodyclose     # HTTP response bodies left open
    - noctx         # HTTP requests without a context
    - misspell      # typos in comments and strings
  exclusions:
    generated: strict    # api/gen is generated by protoc
    rules:
      - path: _test\.go  # tests may ignore errors from cleanup and fixtures
        linters: [errcheck, bodyclose, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [ridehail]
