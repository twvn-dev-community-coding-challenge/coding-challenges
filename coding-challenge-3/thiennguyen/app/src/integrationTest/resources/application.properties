# Start the Postgres, Kafka and Redis Testcontainers concurrently instead of one after another.
spring.testcontainers.beans.startup=parallel

# Faster background loops so asynchronous assertions settle quickly.
outbox.relay.interval-ms=50
outbox.backlog.interval-ms=200
dispatch.expiry-poll-interval-ms=200
dispatch.sweeper-interval-ms=1000

# Long enough that the sweepers never race a test's own dispatch (even after a test advances the clock past an offer
# timeout); tests needing them age their rides explicitly.
dispatch.sweeper-stale-after=30s
ride.undispatched-sweep-interval-ms=1000
ride.undispatched-after=5m
